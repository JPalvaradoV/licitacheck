name: Actualización diaria de licitaciones

on:
  schedule:
    # 7:00 am Chile (UTC-4 en horario de verano, UTC-3 en invierno).
    # 11:00 UTC equivale a 7:00 chile/verano y 8:00 chile/invierno.
    - cron: '0 11 * * *'
  workflow_dispatch:  # permite gatillar manualmente desde la UI de GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesario para commitear el JSON actualizado

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler (incremental + auto-process)
        run: |
          python3 agentes/crawler.py \
            --incremental \
            --auto-process \
            --output ./Licitacion_Publicada.xlsx \
            --sleep 0.15

      # Opcional: agente IA de supresión contextual.
      # Requiere settear el secret ANTHROPIC_API_KEY en el repo.
      # Settings → Secrets and variables → Actions → New repository secret
      - name: Filtro IA contextual (opcional)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 agentes/ia_filter.py

      - name: Commit & push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/graph_data.json agentes/.crawler_cache.csv
          if git diff --staged --quiet; then
            echo "Sin cambios: no se hace commit."
          else
            git commit -m "chore: actualización diaria de licitaciones [skip ci]"
            git push
          fi
